<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Certificaciones Médicas</title>
</head>
<body>
  <h1>Certificaciones Médicas - Panamá</h1>
  <pre id="resultado">Consultando la API...</pre>
  <script>
    const API_URL = "http://localhost:8000";
    fetch(`${API_URL}/health/db`)
      .then(r => r.json())
      .then(d => document.getElementById("resultado").textContent = JSON.stringify(d))
      .catch(e => document.getElementById("resultado").textContent = "Error: " + e);
  </script>
</body>
</html>
